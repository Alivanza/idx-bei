name: Daily IDX Screen

on:
  schedule:
    # 09:45 UTC = 16:45 WIB (Jakarta), Mon-Fri. GitHub's cron scheduler runs on its own
    # infrastructure clock and can lag by several minutes at busy times -- that's normal.
    - cron: "45 9 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab to test

permissions:
  contents: write   # needed so the job can commit the day's new data back to this repo

jobs:
  ingest-and-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: python
        run: $HOME/.local/bin/uv sync

      - name: Ingest today's data
        working-directory: python
        run: |
          $HOME/.local/bin/uv run idx daily
          $HOME/.local/bin/uv run idx corporate

      - name: Run screen and post to Google Sheet
        working-directory: python
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
        run: $HOME/.local/bin/uv run python daily_screen.py

      - name: Commit new data back to the repo
        run: |
          git config user.name "idx-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No new data to commit" || git commit -m "Daily data: $(date -u +%F)"
          git push
