name: Daily IDX Screen

on:
  schedule:
    # 09:45 UTC = 16:45 WIB (Jakarta), Mon-Fri. GitHub's cron scheduler runs on its own
    # infrastructure clock and can lag by several minutes at busy times -- that's normal.
    - cron: "45 9 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab to test

permissions:
  contents: write   # needed so the job can commit the day's new data back to this repo

jobs:
  ingest-and-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: python
        run: $HOME/.local/bin/uv sync

      - name: Ingest today's data
        id: ingest
        working-directory: python
        # Don't let a failed ingest (e.g. IDX/Cloudflare blocking today's attempt) skip
        # every step after it. daily_screen.py below works fine off whatever the most
        # recently ingested date already is, and _ingest_dataset() already skips any
        # date it already has -- so a day that fails here gets picked up automatically
        # by the next run (tomorrow's cron, or a manual re-run) with no special handling.
        # The last step below still fails the whole run red when this happens, so a
        # failed day stays visible instead of going silently green.
        continue-on-error: true
        env:
          IDX_BASE_URL: ${{ vars.IDX_BASE_URL }}
        run: |
          $HOME/.local/bin/uv run idx daily
          $HOME/.local/bin/uv run idx corporate

      - name: Run screen and post to Google Sheet
        working-directory: python
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
        run: $HOME/.local/bin/uv run python daily_screen.py

      - name: Commit new data back to the repo
        run: |
          git config user.name "idx-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No new data to commit" || git commit -m "Daily data: $(date -u +%F)"
          git push

      - name: Fail the run if today's ingest didn't go through
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::Today's ingest failed (see the 'Ingest today's data' step above for the real error). The screen above still ran and posted/committed against the most recent data that DID ingest successfully -- but today's row is still missing. This run is marked failed on purpose so it doesn't go unnoticed; the gap will be picked up automatically whenever ingestion next succeeds."
          exit 1